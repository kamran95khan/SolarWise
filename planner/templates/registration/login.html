
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SolarWise</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            margin: 0;
            padding: 40px 16px;
            color: #243329;
        }

        .card {
            max-width: 430px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0001;
        }

        h1 {
            color: #43852d;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            background: #43852d;
            color: white;
            padding: 12px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #43852d;
        }

        .error {
            color: red;
        }

        .helptext {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login to SolarWise</h1>

        <p>Login to your account and manage your solar projects.</p>

        {% if form.errors %}
            <p class="error">
                Username ya password ghalat hai. Dobara koshish karein.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username"
                   placeholder="Enter your username"
                   autocomplete="username" required>

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Log In</button>
        </form>

        <p>
            Account nahi hai?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>

        <p><a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
