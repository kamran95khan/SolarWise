
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SolarWise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 430px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0001;
        }
        h1 { color: #43852d; }
        input {
            max-width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }
        button {
            background: #43852d;
            color: white;
            padding: 12px 18px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        a { color: #43852d; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login to SolarWise</h1>

        {% if form.errors %}
            <p>Username ya password ghalat hai. Dobara koshish karein.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Log In</button>
        </form>

        <p>
            Account nahi hai?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>

        <p><a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
