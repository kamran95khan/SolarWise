<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project | SolarWise</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            margin: 0;
            padding: 40px 16px;
            color: #243329;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0001;
        }

        h1 { color: #43852d; }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccd5c7;
            border-radius: 6px;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #43852d;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .back { background: #687367; }
    </style>
</head>

<body>

<div class="card">

    <h1>Edit Solar Project</h1>

    <form method="post">
        {% csrf_token %}

        <label for="project_name">Project Name</label>
        <input
            type="text"
            id="project_name"
            name="project_name"
            value="{{ project.name }}"
            maxlength="100"
            required
        >

        <label for="monthly_units">Monthly Electricity Units (kWh)</label>
        <input
            type="number"
            id="monthly_units"
            name="monthly_units"
            value="{{ monthly_units|floatformat:2 }}"
            min="0.01"
            max="100000"
            step="0.01"
            required
        >

        <label for="panel_watt">Panel Wattage (W)</label>
        <input
            type="number"
            id="panel_watt"
            name="panel_watt"
            value="{{ project.panel_watt }}"
            min="1"
            max="2000"
            required
        >

        <button type="submit">Update Project</button>
        <a class="back" href="{% url 'home' %}">Cancel</a>
    </form>

</div>

</body>
</html>
